# Generated by obskitpy. It runs only when obskitpy dispatches it after a deployment is approved (never on push or pull request).
# Add your own deploy steps at the end (container image, cloud job...). The GitHub environment decides who may approve in GitHub, too.
name: Deploy (obskitpy)
run-name: Deploy ${{ inputs.robot }} ${{ inputs.version }} to ${{ inputs.env }}
on:
  workflow_dispatch:
    inputs:
      env:
        description: dev, hmg or prd
        required: true
      robot:
        description: robot key
        required: true
      version:
        description: release version
        required: true
      sha:
        description: commit of the release
        required: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy to ${{ inputs.env }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env == 'prd' && 'production' || inputs.env == 'hmg' && 'staging' || 'development' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - name: Deployment record
        env:
          ROBOT: ${{ inputs.robot }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha }}
          TARGET: ${{ inputs.env }}
        run: |
          echo "Deploying $ROBOT $VERSION ($SHA) to $TARGET"
          echo "obskitpy already pins this commit in the agents of $TARGET."
      - name: Build the robot image and publish it to GitHub Packages
        env:
          ROBOT: ${{ inputs.robot }}
          SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/${ROBOT,,}:${SHA::12}"
          cat > Dockerfile.obskitpy <<'EOF'
          FROM python:3.12-slim
          ENV PYTHONUNBUFFERED=1 PIP_NO_CACHE_DIR=1 PIP_DISABLE_PIP_VERSION_CHECK=1 OBSKITPY_DATA_DIR=/data
          RUN apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*
          RUN pip install "obskitpy==1.1.1"
          WORKDIR /app
          COPY . /app
          RUN if [ -f requirements.txt ]; then pip install -r requirements.txt; elif [ -f pyproject.toml ]; then pip install .; fi
          RUN mkdir -p /data && chmod 777 /data
          ENTRYPOINT ["obskitpy", "agent", "run", "--once", "--source-dir", "/app"]
          EOF
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f Dockerfile.obskitpy -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy to the obskitpy platform
        env:
          ROBOT: ${{ inputs.robot }}
          TARGET: ${{ inputs.env }}
          GH_TOKEN: ${{ github.token }}
          OBSKITPY_URL: ${{ secrets.OBSKITPY_URL }}
          OBSKITPY_TOKEN: ${{ secrets.OBSKITPY_TOKEN }}
        run: |
          jq -n --arg image "$IMAGE" --arg user "$GITHUB_ACTOR" --arg password "$GH_TOKEN" --arg env "$TARGET" \
            '{image: $image, registry_user: $user, registry_password: $password, envs: [$env]}' > body.json
          curl -fsS -X POST "$OBSKITPY_URL/api/v1/robots/key/$ROBOT/azure-deploy" -H "Authorization: Bearer $OBSKITPY_TOKEN" \
            -H "Content-Type: application/json" --data @body.json
