# Generated by obskitpy (rpa). Review it in the Pull Request: nothing here runs arbitrary commands you did not choose.
name: CI
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e ".[test]" || pip install -e .; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint (Ruff)
        run: |
          pip install ruff
          ruff check .

  types:
    name: Types (Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e ".[test]" || pip install -e .; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Types (Mypy)
        run: |
          pip install mypy
          mypy .

  tests:
    name: Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e ".[test]" || pip install -e .; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Tests (Pytest)
        run: |
          pip install pytest
          pytest

  security:
    name: Security (pip-audit, Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e ".[test]" || pip install -e .; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Security (pip-audit, Bandit)
        run: |
          pip install pip-audit bandit
          pip-audit || true
          bandit -r . -ll -q

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [lint, types, tests, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release-hmg:
    name: Release to HMG
    runs-on: ubuntu-latest
    needs: [build]
    environment: hmg  # add required reviewers to this GitHub environment for a manual approval
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - run: echo "Release candidate ${{ github.sha }} ready for HMG; register it in obskitpy."
